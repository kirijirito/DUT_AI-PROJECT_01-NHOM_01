[project]
name = "fnb-order-system"
version = "0.1.0"
description = "Starter project quan ly don hang F&B cho do an sinh vien"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["gradio>=5.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
